name: tangram-env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.8.12  # Python 3.8 是推荐版本
  - pip=23.1.2
  - pytorch=2.0.1  # PyTorch 最新稳定版
  - scipy=1.10.1
  - matplotlib=3.7.1
  - seaborn=0.12.2
  - jupyterlab=3.6.3  # 可选，用于 Jupyter 环境
  - scanpy=1.9.3  # Scanpy 最新稳定版
  - scikit-learn=1.2.2  # 用于聚类和评估指标
  - tqdm=4.65.0  # 进度条工具
  - pandas=1.5.3
  - numpy=1.24.3
  - pip:
    - tangram-sc==1.0.3  # Tangram 最新版
    - muon>=0.1.0  # 用于处理 MuData 格式
    - squidpy>=1.2.3  # 可选，用于空间可视化