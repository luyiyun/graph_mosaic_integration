[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmi"
authors = [
  { name = "Rong Zhiwei", email = "18845728185@163.com" },
  { name = "Yu Yipei", email = "yuhuilz@163.com" },
]
description = "A deep generative model that addresses mosaic integration challenges."
keywords = [
  "bioinformatics",
  "deep-learning",
  "single-cell",
  "moaic-integration",
]
license = { file = "LICENSE" }
requires-python = ">=3.10"
readme = "readme.md"
version = "0.1.0"
# dynamic = ["version"]
dependencies = [
    "anndata>=0.11.3",
    "h5py>=3.12.1",
    "matplotlib>=3.10.0",
    "mudata>=0.3.1",
    "numpy>=2.0.0",
    "pandas>=2.2.3",
    "scanpy>=1.10",
    "scikit-learn>=1.6.1",
    "scipy>=1.15.1",
    "tables>=3.10.1",
    "torch>=2.5.1",
    "tqdm>=4.67.1",
]

# [project.scripts]
# graph-mosaic-integration = "graph_mosaic_integration:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "platform_system == 'Windows'" }]
torchvision = [
  { index = "pytorch-cu124", marker = "platform_system == 'Windows'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "biothings-client>=0.4.0",
    "colorcet>=3.1.0",
    "ipdb>=0.13.13",
    "pytest>=8.3.4",
    "requests-cache>=1.2.1",
    "scib-metrics>=0.5.1",
    "seaborn>=0.13.2",
]
